name: Actualizar farmacias de turno
on:
  schedule:
    - cron: "5 12 * * *"   # ~09:05 hora de Chile (verano)
    - cron: "5 22 * * *"   # ~19:05 hora de Chile (verano)
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
      - name: Guardar cambios
        run: |
          git config user.name "redmaule-bot"
          git config user.email "redmaule-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Turnos $(TZ=America/Santiago date +'%Y-%m-%d %H:%M')"
          git push
